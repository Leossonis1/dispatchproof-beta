services:
  - type: web
    name: dispatchproof-beta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DISPATCHPROOF_SECRET_KEY
        generateValue: true
      - key: DISPATCHPROOF_COMPANY_NAME
        value: DispatchProof Beta
